<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>命运契约</title>
<style>
  :root {
    --gold: #f0c060;
    --gold-glow: #ffd700;
    --angel-bg: #1a1a2e;
    --demon-bg: #1a0a0f;
    --bg: #0a0a1a;
    --text: #e0d8c8;
    --card-bg: #1c1814;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas#particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .screen.active { display: flex; }

  /* ===== CREATE SCREEN ===== */
  .create-title {
    font-size: 2.2em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-glow), #ff6b9d, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    text-align: center;
  }
  .create-subtitle {
    font-size: 0.9em;
    color: #888;
    margin-bottom: 36px;
    letter-spacing: 4px;
  }

  .role-toggle {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 18px;
  }
  .role-option {
    flex: 1;
    padding: 12px 8px;
    border-radius: 14px;
    border: 2px solid #2a2a3a;
    background: #111;
    color: #666;
    font-size: 0.95em;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
    text-align: center;
  }
  .role-option .role-emoji { font-size: 1.3em; display: block; margin-bottom: 2px; }
  .role-option.active.demon-role { border-color: #c0392b; color: #ff6b6b; background: #1a0a0f; }
  .role-option.active.angel-role { border-color: #c0a040; color: #f0c060; background: #1a1a10; }

  .single-name-input {
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
    position: relative;
  }
  .single-name-input input {
    width: 100%;
    background: #151520;
    border: 1px solid #2a2a3a;
    border-radius: 14px;
    color: #ccc;
    font-size: 1.1em;
    text-align: center;
    padding: 14px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.3s;
  }
  .single-name-input input:focus { border-color: #888; }
  .name-hint {
    display: block;
    font-size: 0.7em;
    color: #555;
    margin-top: 6px;
    text-align: center;
  }

  .contract-name-input {
    background: rgba(0,0,0,0.06);
    border: 1px dashed #b0a080;
    border-radius: 6px;
    color: #5a3a10;
    font-size: 0.9em;
    font-family: inherit;
    padding: 4px 10px;
    width: 110px;
    text-align: center;
    outline: none;
    margin-left: 4px;
  }
  .contract-name-input:focus { border-style: solid; border-color: #8a6a30; }


  .clause-input {
    width: 100%;
    max-width: 400px;
    background: #151520;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    color: #aaa;
    font-size: 0.9em;
    padding: 14px;
    resize: none;
    outline: none;
    font-family: inherit;
    margin-bottom: 28px;
    height: 70px;
    transition: border-color 0.3s;
  }
  .clause-input:focus { border-color: #666; }
  .clause-input::placeholder { color: #444; }
  .passphrase-input { margin-bottom: 12px; }

  .passphrase-verify-input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    color: #ccc;
    font-size: 0.9em;
    padding: 12px 14px;
    text-align: center;
    outline: none;
    font-family: inherit;
    transition: border-color 0.3s;
  }
  .passphrase-verify-input:focus { border-color: #888; }

  .btn-sign.locked {
    opacity: 0.35;
    pointer-events: none;
    filter: grayscale(0.6);
  }

  .btn {
    padding: 14px 40px;
    border: none;
    border-radius: 30px;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .btn-create {
    background: linear-gradient(135deg, #c084fc, #ff6b9d, #f0c060);
    color: #fff;
    font-size: 1.1em;
    padding: 16px 50px;
    box-shadow: 0 4px 30px rgba(192,132,252,0.3);
  }
  .btn-create:active { transform: scale(0.95); }

  .btn-sign {
    background: linear-gradient(135deg, #f0c060, #e8a030);
    color: #1a1a1a;
    font-size: 1.2em;
    padding: 18px 60px;
    box-shadow: 0 4px 30px rgba(240,192,96,0.4);
    animation: pulse-gold 2s infinite;
  }
  @keyframes pulse-gold {
    0%, 100% { box-shadow: 0 4px 30px rgba(240,192,96,0.4); }
    50% { box-shadow: 0 4px 50px rgba(240,192,96,0.7); }
  }

  .btn-action {
    background: #1a1a2e;
    border: 1px solid #333;
    color: #ccc;
    padding: 10px 24px;
    font-size: 0.85em;
    letter-spacing: 1px;
  }
  .btn-action:active { background: #2a2a3e; }
  .btn-action.angel-btn { border-color: #4a4a20; color: var(--gold); }
  .btn-action.demon-btn { border-color: #4a1a1a; color: #ff6b6b; }

  .btn-reply {
    background: rgba(255,255,255,0.08);
    border: 1px solid #555;
    color: #ccc;
    padding: 12px 30px;
  }

  .btn-copy {
    background: #1a2a1a;
    border: 1px solid #2a4a2a;
    color: #8fbc8f;
    padding: 8px 20px;
    font-size: 0.8em;
  }

  /* ===== CONTRACT SCREEN ===== */
  .contract-scroll {
    background: linear-gradient(180deg, #f5e6c8 0%, #ede0c0 5%, #faf0dc 50%, #ede0c0 95%, #e8d8b0 100%);
    color: #3a2a10;
    border-radius: 8px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow:
      0 0 0 8px #1a1410,
      0 0 0 10px #3a2a18,
      0 0 0 14px #1a1410,
      0 0 0 15px #5a4a30,
      0 8px 50px rgba(0,0,0,0.6);
    position: relative;
    text-align: center;
  }
  .contract-scroll::before {
    content: '';
    position: absolute;
    top: -8px; left: 20px; right: 20px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #c0a060, transparent);
    border-radius: 2px;
  }
  .contract-scroll::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 20px; right: 20px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #c0a060, transparent);
    border-radius: 2px;
  }

  .contract-ornament {
    font-size: 1.5em;
    letter-spacing: 8px;
    color: #8a6a30;
    margin-bottom: 4px;
  }
  .contract-title {
    font-size: 1.6em;
    font-weight: 900;
    color: #5a3a10;
    letter-spacing: 6px;
    margin: 8px 0 20px;
  }
  .contract-roles {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 16px 0;
    font-size: 1.1em;
    font-weight: 700;
  }
  .contract-angel { color: #8a6a30; }
  .contract-demon { color: #6a2020; }
  .contract-heart { font-size: 1.5em; animation: heartbeat 1s infinite; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
  }

  .contract-clause {
    font-size: 0.85em;
    color: #6a5a3a;
    margin: 16px 0;
    padding: 12px;
    border-top: 1px dashed #c0a060;
    border-bottom: 1px dashed #c0a060;
    line-height: 1.8;
  }
  .contract-sig-line {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    font-size: 0.75em;
    color: #8a7a5a;
  }
  .contract-sig-line span { border-bottom: 1px solid #8a7a5a; padding-bottom: 4px; min-width: 80px; }

  .signature-glow {
    animation: sigGlow 0.6s ease-out;
  }
  @keyframes sigGlow {
    0% { filter: brightness(3); transform: scale(1.05); }
    100% { filter: brightness(1); transform: scale(1); }
  }

  /* ===== DASHBOARD ===== */
  .dash-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .dash-status {
    font-size: 0.8em;
    color: #6a6;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .dash-title {
    font-size: 1.4em;
    font-weight: 700;
    background: linear-gradient(90deg, var(--gold-glow), #ff6b9d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .dash-cards {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 28px;
  }
  .dash-card {
    flex: 1;
    border-radius: 16px;
    padding: 20px 14px;
    text-align: center;
    transition: all 0.3s;
  }
  .dash-card.angel-card {
    background: linear-gradient(180deg, #1e1e30, #1a1a28);
    border: 1px solid #2a2a18;
  }
  .dash-card.demon-card {
    background: linear-gradient(180deg, #1e1018, #1a0a10);
    border: 1px solid #2a1818;
  }
  .dash-card .card-icon { font-size: 2.5em; margin-bottom: 6px; }
  .dash-card .card-role { font-size: 0.75em; color: #666; letter-spacing: 2px; }
  .dash-card .card-name { font-size: 1.1em; font-weight: 700; margin: 4px 0; }
  .angel-card .card-name { color: var(--gold); }
  .demon-card .card-name { color: #ff6b6b; }

  .powers-section {
    width: 100%;
    max-width: 420px;
    display: flex;
    gap: 12px;
  }
  .powers-col {
    flex: 1;
  }
  .powers-label {
    font-size: 0.7em;
    color: #555;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 10px;
  }
  .power-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 12px;
    border: 1px solid #222;
    background: #111;
    color: #aaa;
    font-size: 0.85em;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    text-align: center;
  }
  .power-btn.angel-power { border-color: #2a2a18; }
  .power-btn.angel-power:active { background: #1a1a10; border-color: var(--gold); color: var(--gold); }
  .power-btn.demon-power { border-color: #2a1818; }
  .power-btn.demon-power:active { background: #1a1010; border-color: #ff6b6b; color: #ff6b6b; }

  .power-msg-input {
    width: 100%;
    max-width: 420px;
    margin-top: 12px;
    padding: 10px 14px;
    background: #111;
    border: 1px solid #222;
    border-radius: 10px;
    color: #888;
    font-size: 0.85em;
    text-align: center;
    outline: none;
    font-family: inherit;
  }
  .power-msg-input:focus { border-color: #555; color: #ccc; }

  /* ===== ACTION REVEAL ===== */
  .action-reveal {
    text-align: center;
    animation: revealIn 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes revealIn {
    0% { opacity: 0; transform: scale(0.8) translateY(30px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .action-icon-display { font-size: 5em; animation: floatIcon 2s ease-in-out infinite; }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .action-from {
    font-size: 0.85em;
    color: #666;
    letter-spacing: 2px;
    margin: 8px 0;
  }
  .action-title {
    font-size: 1.8em;
    font-weight: 900;
    margin: 8px 0;
  }
  .action-title.angel-color { color: var(--gold-glow); }
  .action-title.demon-color { color: #ff6b6b; }
  .action-msg {
    font-size: 1em;
    color: #aaa;
    margin: 16px 0 28px;
    padding: 16px 24px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    max-width: 320px;
    line-height: 1.8;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #ccc;
    padding: 12px 28px;
    border-radius: 20px;
    font-size: 0.85em;
    z-index: 100;
    animation: toastIn 0.3s ease-out, toastOut 0.3s 1.7s ease-in forwards;
    pointer-events: none;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- SCREEN: Create Contract -->
<div id="screen-create" class="screen active">
  <div class="create-title">命运契约</div>
  <div class="create-subtitle">✦ BIND YOUR FATES ✦</div>

  <p style="font-size:0.8em;color:#666;margin-bottom:14px;">先选择你的身份</p>

  <div class="role-toggle" id="roleToggle">
    <button class="role-option active" data-role="demon" onclick="selectRole('demon')">
      <span class="role-emoji">😈</span> 我是恶魔
    </button>
    <button class="role-option" data-role="angel" onclick="selectRole('angel')">
      <span class="role-emoji">👼</span> 我是天使
    </button>
  </div>

  <div class="single-name-input">
    <input id="creatorName" type="text" placeholder="你的名字" maxlength="12">
    <span class="name-hint" id="nameHint">TA会自己填她的名字</span>
  </div>

  <textarea class="clause-input" id="clause" placeholder="契约条款（选填）&#10;例如：恶魔必须每天给天使分享一个好玩的东西" maxlength="200"></textarea>

  <input class="clause-input passphrase-input" id="passphrase" type="text" placeholder="契约密语（选填，只有知道密语的人才能签署）" maxlength="30" style="height:44px;">

  <button class="btn btn-create" onclick="createContract()">⚡ 生成契约</button>
</div>

<!-- SCREEN: View & Sign Contract -->
<div id="screen-contract" class="screen">
  <div class="contract-scroll" id="contractScroll">
    <div class="contract-ornament">✦ ✦ ✦</div>
    <div class="contract-title">命 运 契 约</div>
    <div class="contract-roles" id="contractRoles"></div>
    <div class="contract-clause" id="ctClause"></div>
    <p style="font-size:0.75em;color:#8a7a5a;margin-top:12px;">
      双方自愿缔结此约<br>以天使之光辉 ✦ 以恶魔之炽焰<br>绑定命运，永不分离
    </p>
    <div class="contract-sig-line">
      <span id="sigAngel">___________</span>
      <span id="sigDemon">___________</span>
    </div>
  </div>
  <div id="passphraseArea" class="hidden" style="margin-top:22px;text-align:center;max-width:380px;width:100%;">
    <p style="font-size:0.75em;color:#777;margin-bottom:6px;">🔐 此契约设有密语</p>
    <input id="passphraseInput" class="passphrase-verify-input" type="text" placeholder="输入密语解锁签署" maxlength="30" oninput="checkPassphrase()">
    <p id="passphraseError" style="font-size:0.7em;color:#ff6b6b;margin-top:4px;display:none;">密语不正确</p>
  </div>

  <button class="btn btn-sign" id="btnSign" style="margin-top:28px;" onclick="signContract()">
    ✍️ 签署契约
  </button>
  <p style="font-size:0.7em;color:#444;margin-top:8px;" id="signHint">点击签署后，将链接分享回给TA</p>
</div>

<!-- SCREEN: Dashboard -->
<div id="screen-dashboard" class="screen">
  <div class="dash-header">
    <div class="dash-status">🔗 契约已绑定</div>
    <div class="dash-title">命运共同体</div>
  </div>

  <div class="dash-cards">
    <div class="dash-card angel-card">
      <div class="card-icon">👼</div>
      <div class="card-role">天 使</div>
      <div class="card-name" id="dashAngel"></div>
    </div>
    <div class="dash-card demon-card">
      <div class="card-icon">😈</div>
      <div class="card-role">恶 魔</div>
      <div class="card-name" id="dashDemon"></div>
    </div>
  </div>

  <div class="powers-section">
    <div class="powers-col">
      <div class="powers-label">👼 天使之力</div>
      <button class="power-btn angel-power" onclick="sendAction('angel','blessing')">✨ 赐福</button>
      <button class="power-btn angel-power" onclick="sendAction('angel','protect')">🛡️ 守护</button>
      <button class="power-btn angel-power" onclick="sendAction('angel','heal')">💫 治愈</button>
    </div>
    <div class="powers-col">
      <div class="powers-label">😈 恶魔之力</div>
      <button class="power-btn demon-power" onclick="sendAction('demon','tease')">🎭 捉弄</button>
      <button class="power-btn demon-power" onclick="sendAction('demon','charm')">💜 魅惑</button>
      <button class="power-btn demon-power" onclick="sendAction('demon','mischief')">🔥 捣蛋</button>
    </div>
  </div>

  <input class="power-msg-input" id="powerMsg" type="text" placeholder="附加一句话（选填）" maxlength="60">

  <button class="btn btn-copy" style="margin-top:20px;" onclick="copyDashboardLink()">📋 复制本页链接</button>
</div>

<!-- SCREEN: Action Reveal -->
<div id="screen-action" class="screen">
  <div class="action-reveal">
    <div class="action-icon-display" id="actionIcon"></div>
    <div class="action-from" id="actionFrom"></div>
    <div class="action-title" id="actionTitle"></div>
    <div class="action-msg" id="actionMsg"></div>
    <button class="btn btn-reply" onclick="goToDashboard()">💌 回应 TA</button>
  </div>
</div>

<script>
// ====== UTILS ======
function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return (hash >>> 0).toString(36);
}

function encode(data) {
  return btoa(encodeURIComponent(JSON.stringify(data)));
}
function decode(str) {
  try { return JSON.parse(decodeURIComponent(atob(str))); }
  catch(e) { return null; }
}

function getParams() {
  const hash = window.location.hash.slice(1);
  return new URLSearchParams(hash);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2100);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('✅ 链接已复制！发给TA吧'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ 链接已复制！发给TA吧');
  }
}

// ====== CONTRACT DATA ======
let currentContract = null;
let currentSigner = null;
let creatorRole = 'demon'; // default

function selectRole(role) {
  creatorRole = role;
  document.querySelectorAll('.role-option').forEach(btn => {
    btn.classList.remove('active', 'demon-role', 'angel-role');
  });
  const btn = document.querySelector(`[data-role="${role}"]`);
  btn.classList.add('active', role === 'demon' ? 'demon-role' : 'angel-role');
  const hint = document.getElementById('nameHint');
  hint.textContent = role === 'demon' ? 'TA（天使）会自己填她的名字' : 'TA（恶魔）会自己填他的名字';
}

function createContract() {
  const creatorName = document.getElementById('creatorName').value.trim();
  const clause = document.getElementById('clause').value.trim();
  const passphrase = document.getElementById('passphrase').value.trim();

  if (!creatorName) { toast('请填写你的名字'); return; }

  const otherRole = creatorRole === 'demon' ? 'angel' : 'demon';
  currentContract = {
    creator: creatorRole,
    [creatorRole]: creatorName,
    [otherRole]: '',
    clause: clause || '天使与恶魔，在此绑定命运。',
    locked: !!passphrase,
    code: passphrase ? simpleHash(passphrase) : null,
    ts: Date.now()
  };
  const hash = 'contract=' + encode(currentContract);
  window.location.hash = hash;
  showContract(currentContract);
}

function buildContractRoles(contract, editable) {
  const container = document.getElementById('contractRoles');
  // Backward compat: old contracts with both names pre-filled, no creator field
  if (!contract.creator) {
    container.innerHTML = `
      <span class="contract-angel">👼 ${contract.angel || '___'}</span>
      <span class="contract-heart">♡</span>
      <span class="contract-demon">${contract.demon || '___'} 😈</span>
    `;
    return;
  }
  const otherRole = contract.creator === 'demon' ? 'angel' : 'demon';
  const creatorName = contract[contract.creator];
  const otherName = contract[otherRole] || '';

  const creatorIcon = contract.creator === 'demon' ? '😈' : '👼';
  const otherIcon = contract.creator === 'demon' ? '👼' : '😈';

  // Build HTML
  const leftIsCreator = contract.creator === 'demon'; // demon on left
  const leftName = leftIsCreator ? creatorName : otherName;
  const rightName = leftIsCreator ? otherName : creatorName;
  const leftIcon = leftIsCreator ? creatorIcon : otherIcon;
  const rightIcon = leftIsCreator ? otherIcon : creatorIcon;
  const leftRole = leftIsCreator ? contract.creator : otherRole;
  const rightRole = leftIsCreator ? otherRole : contract.creator;

  const makeSlot = (name, icon, role, isCreator) => {
    const colorClass = role === 'angel' ? 'contract-angel' : 'contract-demon';
    if (isCreator || (name && editable === false)) {
      return `<span class="${colorClass}">${icon} ${name || '___'}</span>`;
    }
    return `<span class="${colorClass}">${icon} <input class="contract-name-input" id="ctOtherName" type="text" placeholder="${role === 'angel' ? '天使之名' : '恶魔之名'}" value="${name}" maxlength="12"></span>`;
  };

  container.innerHTML = `
    ${makeSlot(leftName, leftIcon, leftRole, leftIsCreator)}
    <span class="contract-heart">♡</span>
    ${makeSlot(rightName, rightIcon, rightRole, !leftIsCreator)}
  `;
}

function showContract(contract) {
  currentContract = contract;
  currentSigner = null;
  showScreen('contract');

  buildContractRoles(contract, true);
  document.getElementById('ctClause').textContent = contract.clause || '天使与恶魔，在此绑定命运。';
  document.getElementById('sigAngel').textContent = '___________';
  document.getElementById('sigDemon').textContent = '___________';

  const signHint = document.getElementById('signHint');
  if (contract.creator) {
    const otherRole = contract.creator === 'demon' ? 'angel' : 'demon';
    const roleLabel = otherRole === 'angel' ? '天使' : '恶魔';
    signHint.textContent = `请${roleLabel}填写名字并签署契约 ✨`;
  } else {
    signHint.textContent = '点击签署后，将链接分享回给TA';
  }

  // Handle passphrase
  const passArea = document.getElementById('passphraseArea');
  const passInput = document.getElementById('passphraseInput');
  const passErr = document.getElementById('passphraseError');
  const signBtn = document.getElementById('btnSign');

  if (contract.locked && contract.code) {
    passArea.classList.remove('hidden');
    passInput.value = '';
    passErr.style.display = 'none';
    signBtn.classList.remove('hidden');
    signBtn.classList.add('locked');
  } else {
    passArea.classList.add('hidden');
    signBtn.classList.remove('hidden');
    signBtn.classList.remove('locked');
  }

  // Check if already signed by current viewer
  const params = getParams();
  const signed = params.get('signed');
  if (signed) {
    showBothSigned(contract, signed);
  }
}

function checkPassphrase() {
  if (!currentContract || !currentContract.locked) return;
  const input = document.getElementById('passphraseInput').value.trim();
  const err = document.getElementById('passphraseError');
  const signBtn = document.getElementById('btnSign');

  if (!input) {
    signBtn.classList.add('locked');
    err.style.display = 'none';
    return;
  }

  if (simpleHash(input) === currentContract.code) {
    err.style.display = 'none';
    signBtn.classList.remove('locked');
  } else {
    err.style.display = 'block';
    signBtn.classList.add('locked');
  }
}

function signContract() {
  if (!currentContract) return;

  // Get the name the recipient filled in
  const otherRole = currentContract.creator === 'demon' ? 'angel' : 'demon';
  const nameInput = document.getElementById('ctOtherName');
  if (nameInput) {
    const name = nameInput.value.trim();
    if (!name) { toast('请先填写你的名字'); return; }
    currentContract[otherRole] = name;
  }

  const scroll = document.getElementById('contractScroll');
  scroll.classList.add('signature-glow');
  setTimeout(() => scroll.classList.remove('signature-glow'), 600);

  currentSigner = 'bound';
  document.getElementById('sigAngel').textContent = '已签署 ✦';
  document.getElementById('sigDemon').textContent = '已签署 ✦';
  document.getElementById('btnSign').classList.add('hidden');
  document.getElementById('passphraseArea').classList.add('hidden');
  document.getElementById('signHint').textContent = '契约生效！请把此链接分享回给TA ✨';
  burstParticles();

  const hash = 'contract=' + encode(currentContract) + '&signed=bound';
  window.location.hash = hash;
}

function showBothSigned(contract, signed) {
  currentContract = contract;
  currentSigner = signed;
  showScreen('contract');
  buildContractRoles(contract, false);
  document.getElementById('ctClause').textContent = contract.clause || '天使与恶魔，在此绑定命运。';
  document.getElementById('sigAngel').textContent = '已签署 ✦';
  document.getElementById('sigDemon').textContent = '已签署 ✦';
  document.getElementById('btnSign').classList.add('hidden');
  document.getElementById('passphraseArea').classList.add('hidden');
  document.getElementById('signHint').textContent = contract.locked ? '🔒 契约已封印，仅此一份' : '契约已双向绑定 ✨';
  burstParticles();
  setTimeout(() => showDashboard(contract), 1800);
}

function showDashboard(contract) {
  currentContract = contract;
  showScreen('dashboard');
  document.getElementById('dashAngel').textContent = contract.angel;
  document.getElementById('dashDemon').textContent = contract.demon;
  const statusEl = document.querySelector('.dash-status');
  if (statusEl) {
    statusEl.textContent = contract.locked ? '🔒 封印契约 · 仅此一份' : '🔗 契约已绑定';
  }
}

// ====== ACTIONS ======
const actions = {
  blessing:  { icon: '✨', title: '天使的赐福', msg: '愿圣光庇护你，今天也要元气满满！', cls: 'angel-color', from: '来自天使' },
  protect:   { icon: '🛡️', title: '天使的守护', msg: '无论发生什么，我都在你身边。', cls: 'angel-color', from: '来自天使' },
  heal:      { icon: '💫', title: '天使的治愈', msg: '所有的疲惫都消散吧～光与你同在。', cls: 'angel-color', from: '来自天使' },
  tease:     { icon: '🎭', title: '恶魔的捉弄', msg: '嘿嘿，被我盯上的人别想逃～', cls: 'demon-color', from: '来自恶魔' },
  charm:     { icon: '💜', title: '恶魔的魅惑', msg: '你已经被我蛊惑了，永远都是我的。', cls: 'demon-color', from: '来自恶魔' },
  mischief:  { icon: '🔥', title: '恶魔的捣蛋', msg: '今天也要给你搞点小破坏！接招！', cls: 'demon-color', from: '来自恶魔' },
};

function sendAction(role, type) {
  if (!currentContract) return;
  const customMsg = document.getElementById('powerMsg').value.trim();
  const def = actions[type];
  const msg = customMsg || def.msg;
  const actionData = { role, type, msg, ts: Date.now() };
  const hash = 'contract=' + encode(currentContract) + '&signed=bound&action=' + encode(actionData);
  const url = window.location.origin + window.location.pathname + '#' + hash;
  copyToClipboard(url);
}

function showActionScreen(contract, signed, actionData) {
  currentContract = contract;
  currentSigner = signed;
  const def = actions[actionData.type];
  if (!def) { showDashboard(contract); return; }

  showScreen('action');
  document.getElementById('actionIcon').textContent = def.icon;
  document.getElementById('actionFrom').textContent = def.from + ' · ' + (actionData.role === 'angel' ? contract.angel : contract.demon);
  document.getElementById('actionTitle').textContent = def.title;
  document.getElementById('actionTitle').className = 'action-title ' + def.cls;
  document.getElementById('actionMsg').textContent = actionData.msg || def.msg;

  // Trigger particle burst matching the action
  if (actionData.role === 'demon') {
    burstDemonParticles();
  } else {
    burstAngelParticles();
  }
}

function goToDashboard() {
  if (currentContract) {
    const hash = 'contract=' + encode(currentContract) + '&signed=bound';
    window.location.hash = hash;
    showDashboard(currentContract);
  }
}

function copyDashboardLink() {
  if (!currentContract) return;
  const hash = 'contract=' + encode(currentContract) + '&signed=bound';
  const url = window.location.origin + window.location.pathname + '#' + hash;
  copyToClipboard(url);
}

// ====== PARTICLES ======
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let particleBurst = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 10;
    this.size = Math.random() * 2.5 + 1;
    this.speedY = -(Math.random() * 0.6 + 0.2);
    this.speedX = (Math.random() - 0.5) * 0.4;
    this.opacity = Math.random() * 0.6 + 0.2;
    this.type = Math.random() > 0.5 ? 'angel' : 'demon';
    this.life = 1;
    this.decay = 0;
  }
  update() {
    this.y += this.speedY;
    this.x += this.speedX;
    if (this.decay > 0) {
      this.life -= this.decay;
      this.opacity = Math.max(0, this.life);
    }
    if (this.y < -10 || this.life <= 0) this.reset();
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    if (this.type === 'angel') {
      ctx.fillStyle = `rgba(240,192,96,${this.opacity})`;
    } else {
      ctx.fillStyle = `rgba(200,60,80,${this.opacity * 0.7})`;
    }
    ctx.fill();
  }
}

for (let i = 0; i < 60; i++) {
  const p = new Particle();
  p.y = Math.random() * canvas.height;
  particles.push(p);
}

// Burst particles
class BurstParticle {
  constructor(x, y, color, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.life = 1;
    this.size = Math.random() * 3 + 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.03;
    this.life -= 0.015;
  }
  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = this.color.replace('1)', `${this.life})`);
    ctx.fill();
  }
}

let burstParticlesArr = [];

function burstParticles() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  for (let i = 0; i < 40; i++) {
    const angle = (Math.PI * 2 * i) / 40;
    const speed = Math.random() * 4 + 2;
    burstParticlesArr.push(new BurstParticle(cx, cy, 'rgba(240,192,96,1)', Math.cos(angle) * speed, Math.sin(angle) * speed));
    burstParticlesArr.push(new BurstParticle(cx, cy, 'rgba(200,100,200,1)', Math.cos(angle + 0.1) * speed * 0.7, Math.sin(angle + 0.1) * speed * 0.7));
  }
}

function burstAngelParticles() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  for (let i = 0; i < 30; i++) {
    const angle = (Math.PI * 2 * i) / 30;
    const speed = Math.random() * 3 + 1;
    burstParticlesArr.push(new BurstParticle(cx, cy, 'rgba(255,215,0,1)', Math.cos(angle) * speed, Math.sin(angle) * speed));
  }
}

function burstDemonParticles() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  for (let i = 0; i < 35; i++) {
    const angle = (Math.PI * 2 * i) / 35;
    const speed = Math.random() * 5 + 2;
    burstParticlesArr.push(new BurstParticle(cx, cy, 'rgba(255,80,80,1)', Math.cos(angle) * speed, Math.sin(angle) * speed));
    burstParticlesArr.push(new BurstParticle(cx, cy, 'rgba(180,60,180,1)', Math.cos(angle + 0.3) * speed * 0.6, Math.sin(angle + 0.3) * speed * 0.6));
  }
}

function animate() {
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of particles) {
    p.update();
    p.draw(ctx);
  }

  for (let i = burstParticlesArr.length - 1; i >= 0; i--) {
    burstParticlesArr[i].update();
    burstParticlesArr[i].draw(ctx);
    if (burstParticlesArr[i].life <= 0) burstParticlesArr.splice(i, 1);
  }
}
animate();

// ====== ROUTER ======
function route() {
  const params = getParams();
  const actionStr = params.get('action');
  const contractStr = params.get('contract');
  const signed = params.get('signed');

  if (actionStr && contractStr) {
    const contract = decode(contractStr);
    const action = decode(actionStr);
    if (contract && action) {
      showActionScreen(contract, signed, action);
      return;
    }
  }

  if (contractStr) {
    const contract = decode(contractStr);
    if (contract) {
      if (signed === 'bound') {
        showBothSigned(contract, signed);
      } else {
        showContract(contract);
      }
      return;
    }
  }

  showScreen('create');
}

window.addEventListener('hashchange', route);
route();
